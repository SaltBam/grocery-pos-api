name: CI Pipeline

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9 

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        run: pnpm audit --audit-level high

      - name: Dependency Hygiene (Depcheck)
        run: pnpm dlx depcheck

      - name: License Compliance Check
        run: pnpm dlx license-checker --summary --failOn "GPL-2.0;GPL-3.0;AGPL-3.0"

      - name: Lint Code
        run: pnpm run lint

      - name: Build Application
        run: pnpm run build
        env:
          VITE_NODE_ENV: prod
          VITE_API_URL: https://api.ci-test.com
          VITE_DOMAIN: ci-test.com
          VITE_API_TIMEOUT: 5000